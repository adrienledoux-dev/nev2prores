name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-apple-silicon:
    name: Apple Silicon (Metal + VideoToolbox + Clippy)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Lint with zero warnings (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, Metal GPU, and VideoToolbox round-trip tests
        run: cargo test --all-targets -- --nocapture

      - name: Smoke-test macOS .app and .dmg bundle script
        run: |
          ./scripts/bundle_macos_app.sh
          test -d dist/nev2prores.app
          test -f dist/nev2prores.dmg
          test -f dist/SHA256SUMS.txt
