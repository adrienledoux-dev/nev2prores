name: Release macOS DMG

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build, Sign & Publish nev2prores.dmg
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run full verification suite before packaging
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

      - name: Import Apple Developer ID certificate (optional — skipped if secret unset)
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$SIGNING_IDENTITY" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/nev2prores-signing.keychain-db"
            KEYCHAIN_PASS="$(uuidgen)"
            CERT_PATH="$RUNNER_TEMP/certificate.p12"

            echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

            rm -f "$CERT_PATH"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

            if [ -n "$API_KEY_BASE64" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER_ID" ]; then
              API_KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
              echo "$API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
              chmod 600 "$API_KEY_PATH"
              echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
              echo "APPLE_API_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
              echo "APPLE_API_ISSUER_ID=$API_ISSUER_ID" >> "$GITHUB_ENV"
            fi
          else
            echo "Apple Developer ID secrets not configured; building ad-hoc signed DMG."
          fi

      - name: Build, Sign & (Optionally) Notarize macOS App + DMG
        run: ./scripts/bundle_macos_app.sh

      - name: Clean up temporary signing keychain & API key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/nev2prores-signing.keychain-db" >/dev/null 2>&1 || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/nev2prores.dmg
            dist/SHA256SUMS.txt
